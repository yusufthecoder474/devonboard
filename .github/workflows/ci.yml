name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: devonboard, POSTGRES_PASSWORD: devonboard, POSTGRES_DB: devonboard }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U devonboard" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://devonboard:devonboard@localhost:5432/devonboard?schema=public
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: "api/package-lock.json" }
      - run: npm ci
        working-directory: api
      - run: npx prisma migrate deploy
        working-directory: api
      - run: npm run lint
        working-directory: api
      - run: npm test
        working-directory: api
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: "web/package-lock.json" }
      - run: npm ci && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
