services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: devonboard, POSTGRES_PASSWORD: devonboard, POSTGRES_DB: devonboard }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U devonboard"], interval: 5s, timeout: 5s, retries: 10 }
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://devonboard:devonboard@db:5432/devonboard?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret}
      CORS_ORIGIN: http://localhost:5173
      PORT: "4000"
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy } }
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm start"
  web:
    build: ./web
    ports: ["5173:80"]
    depends_on: [api]
volumes: { pgdata: {} }
